name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  DEPLOY_PATH: /var/www/beam-laravel

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_metadata.outputs.release_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set release metadata
        id: release_metadata
        run: echo "release_name=$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare test application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force

      - name: Build frontend assets
        run: |
          npm run build
          test -f public/build/manifest.json

      - name: Run CI checks (lint temporarily disabled)
        run: |
          npm run format:check
          composer run types:check
          php artisan config:clear --ansi
          php artisan test --compact

      - name: Create release archive
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            --exclude='./tests' \
            --exclude='./database/database.sqlite' \
            --exclude='./release.tar.gz' \
            .

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.release_metadata.outputs.release_name }}
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 5

  deploy:
    name: Deploy to development
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: development
      cancel-in-progress: false

    env:
      RELEASE_NAME: ${{ needs.build.outputs.release_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ env.RELEASE_NAME }}
          path: ${{ runner.temp }}/release

      - name: Configure SSH
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_DOMAIN"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          if [ "$DEPLOY_PORT" = "22" ]; then
            known_hosts_target="$DEPLOY_HOST"
          else
            known_hosts_target="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_hosts_target" -f "$HOME/.ssh/known_hosts" > /dev/null || {
            echo "DEPLOY_KNOWN_HOSTS does not contain a matching host key for $known_hosts_target."
            exit 1
          }
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" > /dev/null || {
            echo "DEPLOY_SSH_KEY is not a valid unencrypted OpenSSH private key."
            exit 1
          }

      - name: Create release directory
        run: |
          ssh -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$RELEASE_NAME'"

      - name: Transfer release artifact
        run: |
          scp -P "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/release/release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_NAME/release.tar.gz"

      - name: Extract and activate release
        run: |
          ssh -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$RELEASE_NAME' && tar -xzf release.tar.gz && rm release.tar.gz && bash deploy/remote-deploy.sh '$DEPLOY_PATH' '$RELEASE_NAME' development"

      - name: Verify application health
        run: |
          ssh -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl --fail --silent --show-error -H 'Host: $DEPLOY_DOMAIN' http://127.0.0.1/up > /dev/null"

      - name: Delete release artifact
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(curl --fail --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=release-$RELEASE_NAME" \
            | jq -r '.artifacts[0].id')"
          test -n "$artifact_id"
          test "$artifact_id" != null
          curl --fail --silent --show-error -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
